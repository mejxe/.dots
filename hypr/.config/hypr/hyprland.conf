windowrulev2 = float,class:^(jetbrains-clion)$,title:^(Welcome to CLion)$
windowrulev2 = float,class:^(jetbrains-idea)$,title:^(Welcome to IntelliJ IDEA)$
windowrulev2 = float,class:^(jetbrains-rustrover)$,title:^(Welcome to RustRover)$
windowrule = content none, match:class mpv

windowrulev2 = float,class:^(KeePass2)$
windowrulev2 = center, class:^(KeePass2)$
windowrulev2 = size 1000 600, class:^(KeePass2)$, title:^(KeePass)$
windowrulev2 = size 1000 600, class:^(KeePass2)$, title:^(Database.kdbx - KeePass)$
windowrulev2 = size 550 300, class:^(KeePass2)$, title:^(Open Database - Database.kdbx)$

windowrulev2 = size 900 800, class:^(Vivaldi-stable)$, title:^(Vivaldi Settings: Start Page - Vivaldi)$
windowrulev2 = center, class:^(Vivaldi-stable)$, title:^(Vivaldi Settings: Start Page - Vivaldi)$
windowrulev2 = size 900 800, class:^(Vivaldi-stable)$, title:^(Vivaldi Settings: General - Vivaldi)$
windowrulev2 = center, class:^(Vivaldi-stable)$, title:^(Vivaldi Settings: General - Vivaldi)$
windowrulev2 = size 1000 800, class:^(Nsxiv)$, title:^(nsxiv)$

windowrulev2 = workspace 9, class:^(.*Docker Desktop.*)$
windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

# windowrule for inactive opacity
windowrulev2 = opacity 1.2, class:^(jetbrains-studio)$
windowrulev2 = opacity 1.2, class:^(jetbrains-idea)$
windowrulev2 = opacity 1.2, class:^(jetbrains-studio)$
windowrulev2 = opacity 1.2, class:^(jetbrains-rustrover)$


windowrule = match:class ^(org.pulseaudio.pavucontrol)$, float on, move 1170 35
windowrule = match:class blueman-manager, float on, move 1570 35, size 50 250


#Binds
#swap caps and esc
input {
    kb_options = caps:swapescape
}

$mainMod = SUPER
bind= $mainMod, F1, exec, ~/.config/hypr/powermenu.sh
bind= $mainMod, Q, exec, kitty
bind= $mainMod, F7, exec, hyprctl switchxkblayout at-translated-set-2-keyboard next
bind= $mainMod, D, killactive,
bind= $mainMod, e, exec, emacs
bind= $mainMod, F, exec, kitty -e yazi
bind= $mainMod SHIFT, P, exit,
bind= $mainMod SHIFT, SPACE, togglefloating,
binde= $mainMod SHIFT, right, exec, playerctl next
bind= $mainMod, SPACE, exec, playerctl play-pause
binde= $mainMod SHIFT, left, exec, playerctl previous
binde=, PRINT, exec, grim - | wl-copy --type image/png
bind= $mainMod,R, exec,/home/mejxe/.config/rofi/launchers/type-1/launcher.sh rofi
bind =, XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
binde=, XF86AudioRaiseVolume, exec, pactl -- set-sink-volume @DEFAULT_SINK@ +5%
binde=, XF86AudioLowerVolume, exec, pactl -- set-sink-volume @DEFAULT_SINK@ -5%
binde=, XF86MonBrightnessUp, exec, brightnessctl set +5%
binde=, XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = $mainMod, l, movefocus, r
bind = $mainMod, h, movefocus, l
bind = $mainMod, k, movefocus, d
bind = $mainMod, j, movefocus, u
bind = $mainMod, 1, split-workspace, 1
bind = $mainMod, 2, split-workspace, 2
bind = $mainMod, 3, split-workspace, 3
bind = $mainMod, 4, split-workspace, 4
bind = $mainMod, 5, split-workspace, 5
bind = $mainMod, 6, split-workspace, 6
bind = $mainMod, 7, split-workspace, 7
bind = $mainMod, 8, split-workspace, 8
bind = $mainMod, 9, split-workspace, 9
bind = $mainMod, 0, split-workspace, 10
bind = $mainMod SHIFT, 1, split-movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, split-movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, split-movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, split-movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, split-movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, split-movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, split-movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, split-movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, split-movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, split-movetoworkspacesilent, 10
bind = $mainMod, mouse_down, workspace, e+1
bindl = ,switch:Lid Switch, exec, gtklock
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
# Screenshots
bind = $mainMod SHIFT, s, exec, hyprshot -m region --clipboard-only
bind = ,PRINT, exec, hyprshot -m output --clipboard-only
bind = SHIFT, PRINT, exec, hyprshot -m region
